# Produção num VPS que já tem um reverse proxy (Caddy do sistema) nas portas 80/443.
# Sobe só o app, em 127.0.0.1:3010; o proxy externo faz TLS e encaminha pra cá.
# Uso:  EONARGA_TAG=0.1.0 docker compose -f compose.prod.yml up -d
services:
  app:
    image: eonarga:${EONARGA_TAG:-latest}
    container_name: eonarga
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/eonarga.db
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "127.0.0.1:${EONARGA_PORT:-3010}:3000"
    volumes:
      - app_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_data:
