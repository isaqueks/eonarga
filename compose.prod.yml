# Produção na VPS do projeto (Ubuntu 24 + Docker). O Caddy do sistema (portas 80/443,
# atrás do Cloudflare) faz TLS e encaminha pra 127.0.0.1:3010. Sobem dois containers:
# o app e o Postgres (docs/08 #55), que só o app enxerga (nenhuma porta no host).
# Uso:  EONARGA_TAG=0.19.0 docker compose -f compose.prod.yml up -d
# O .env precisa de POSTGRES_PASSWORD (`openssl rand -hex 24`) além das variáveis do app.
services:
  db:
    image: postgres:18-alpine
    container_name: eonarga-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eonarga
      POSTGRES_USER: eonarga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # UTF-8 com ordenação por byte (C.UTF-8), a mesma que o SQLite tinha e que o PGlite
      # dos testes usa: ranking e listas não mudam de ordem entre teste e produção (docs/03).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8"
    volumes:
      - pg_data:/var/lib/postgresql
    shm_size: 128m
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eonarga -d eonarga"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    image: eonarga:${EONARGA_TAG:-latest}
    container_name: eonarga
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://eonarga:${POSTGRES_PASSWORD}@db:5432/eonarga
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EONARGA_PORT:-3010}:3000"
    volumes:
      - app_data:/app/data
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Uploads (fotos, vídeos, áudios). Backup: deploy/backup.sh.
  app_data:
  # Postgres. Backup: deploy/backup.sh (pg_dump diário).
  pg_data:
